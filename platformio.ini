; Roland GP-8 MIDI foot controller - STM32F401RCT6
; Bare-metal CMSIS (no HAL library). Flash with USB DFU: SWD pins are used as GPIO.
[env:f401rc]
platform = ststm32
board = genericSTM32F401RC
framework = cmsis
upload_protocol = dfu
build_flags = -Wall -Wextra
; MIDI_Channel is stored in flash sector 3 (0x0800C000), so the program must
; stay below 48 KB. The build fails if it grows past this limit.
board_upload.maximum_size = 49152
extra_scripts = post:generate_hex.py